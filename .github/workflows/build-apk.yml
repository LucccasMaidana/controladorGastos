name: Compilar APK Android (Libreta Contable)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar Licencias de Android SDK Preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Sincronizar Assets Web Actualizados a la App Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html manifest.json favicon.svg js styles assets android/app/src/main/assets/www/
          echo "Assets web copiados exitosamente."

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK Debug con Gradle
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace || (gradle wrapper --gradle-version 8.5 && chmod +x gradlew && ./gradlew assembleDebug --stacktrace)

      - name: Preparar APK para distribución
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} dist/LibretaContable-v1.0.apk \;
          ls -la dist/

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: LibretaContable-Android-APK
          path: dist/LibretaContable-v1.0.apk
          retention-days: 30

      - name: Publicar Release con APK en GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "Libreta Contable Familiar v1.0.1 (APK)"
          body: |
            ### 📱 Libreta Contable Familiar - Instalador Android (.apk) v1.0.1
            
            Descarga el archivo `LibretaContable-v1.0.apk` en tu celular Android e instálalo para tener la app completa en pantalla completa con soporte offline.
            
            - **Vista 100% Móvil Nativa:** Sin barras de desarrollo web ni marcos simulados en el celular.
            - **Panel Admin con Scroll Táctil:** El panel de administración ahora cuenta con scroll vertical completo en teléfonos.
            - **Soporte Offline Completo:** Basado en WebViewAssetLoader seguro para carga instantánea de scripts ES6 e IndexedDB.
            - **Usuario familiar:** Mariel Vallejos / Lucas Maidana
            - **Acceso secreto:** Escribe `Admin` y clave `JjunieBronce1`
            - **Botón Atrás Físico Integrado:** Cierra teclados numéricos o regresa al Inicio.
          files: dist/LibretaContable-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
