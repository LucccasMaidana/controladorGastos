<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#appGrad)" filter="url(#shadow)"/>

  <!-- Ledger Book Base -->
  <path d="M16 16 C16 14.5 17.5 14 19 14 L46 14 C47.5 14 48 15 48 16.5 L48 48 C48 49.5 47 50 45 50 L19 50 C17 50 16 49 16 47 Z" fill="#ffffff" fill-opacity="0.95"/>
  
  <!-- Spine Line -->
  <line x1="24" y1="14" x2="24" y2="50" stroke="#059669" stroke-width="2" stroke-linecap="round"/>

  <!-- Cash Banknote Symbol -->
  <rect x="28" y="19" width="16" height="10" rx="2" fill="#10b981"/>
  <circle cx="36" cy="24" r="2.5" fill="#ffffff"/>

  <!-- Credit Card Symbol -->
  <rect x="26" y="32" width="18" height="11" rx="2.5" fill="#4f46e5"/>
  <rect x="26" y="35" width="18" height="2" fill="#312e81"/>
  <circle cx="30" cy="39.5" r="1.2" fill="#f59e0b"/>
  <circle cx="33" cy="39.5" r="1.2" fill="#ef4444" fill-opacity="0.8"/>
</svg>
